<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Корзина — New City</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ШАПКА -->
<header class="header">
    <!-- Скопируйте header из index.html -->
</header>

<!-- СТРАНИЦА КОРЗИНЫ -->
<main class="cart-page">
    <div class="container">
        <h1 class="section-title">Корзина</h1>

        <div class="cart-content">
            <!-- Список товаров -->
            <div class="cart-items">
                <div class="cart-item">
                    <img src="img/пальто%20из%20исскуственной%20кожи.svg" alt="Пальто" class="cart-item__img">
                    <div class="cart-item__info">
                        <h3>Пальто из искусственной кожи</h3>
                        <p class="price">≈ 11 699 ₽</p>
                        <div class="cart-item__controls">
                            <button class="quantity-btn">−</button>
                            <span class="quantity">1</span>
                            <button class="quantity-btn">+</button>
                            <button class="cart-item__remove">Удалить</button>
                        </div>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="img/джинсы1.svg" alt="Джинсы" class="cart-item__img">
                    <div class="cart-item__info">
                        <h3>Джинсы с высокой посадкой</h3>
                        <p class="price">≈ 4 699 ₽</p>
                        <div class="cart-item__controls">
                            <button class="quantity-btn">−</button>
                            <span class="quantity">1</span>
                            <button class="quantity-btn">+</button>
                            <button class="cart-item__remove">Удалить</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Итоги -->
            <div class="cart-summary">
                <h2>Итого</h2>
                <div class="cart-summary__row">
                    <span>Товары (2)</span>
                    <span>16 398 ₽</span>
                </div>
                <div class="cart-summary__row">
                    <span>Доставка</span>
                    <span>Бесплатно</span>
                </div>
                <div class="cart-summary__total">
                    <span>Всего</span>
                    <span class="price">16 398 ₽</span>
                </div>
                <button class="btn btn--primary" style="width: 100%; margin-top: 24px;">Оформить заказ</button>
                <a href="index.html" class="view-more" style="display: block; text-align: center; margin-top: 16px;">← Продолжить покупки</a>
            </div>
        </div>
    </div>
</main>

<!-- ПОДВАЛ -->
<footer class="footer">
    <!-- Скопируйте footer из index.html -->
</footer>

<script>
    // Скопируйте JS из index.html
</script>
</body>
</html>
