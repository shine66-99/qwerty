<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мой профиль — New City</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ШАПКА -->
<header class="header">
    <!-- Скопируйте весь header из index.html -->
    <!-- (для краткости здесь не дублирую — просто вставьте как есть) -->
</header>

<!-- СТРАНИЦА ПРОФИЛЯ -->
<main class="profile-page">
    <div class="container">
        <h1 class="section-title">Мой профиль</h1>

        <div class="profile-content">
            <div class="profile-info">
                <h2>Личные данные</h2>
                <div class="profile-field">
                    <label>Имя</label>
                    <p>Анна</p>
                </div>
                <div class="profile-field">
                    <label>Email</label>
                    <p>anna@example.com</p>
                </div>
                <div class="profile-field">
                    <label>Телефон</label>
                    <p>+7 955 008 38 85</p>
                </div>
                <button class="btn btn--primary" style="margin-top: 20px;">Редактировать профиль</button>
            </div>

            <div class="profile-orders">
                <h2>Мои заказы</h2>
                <div class="order-item">
                    <div>
                        <strong>Заказ #1024</strong><br>
                        <span class="order-date">12 мая 2025</span>
                    </div>
                    <span class="order-status">Доставлен</span>
                </div>
                <div class="order-item">
                    <div>
                        <strong>Заказ #1018</strong><br>
                        <span class="order-date">3 мая 2025</span>
                    </div>
                    <span class="order-status order-status--processing">В пути</span>
                </div>
                <a href="#" class="view-more" style="margin-top: 16px;">История заказов →</a>
            </div>

            <div class="profile-favorites">
                <h2>Избранное</h2>
                <div class="products-grid">
                    <div class="product-card">
                        <img src="img/пальто%20из%20исскуственной%20кожи.svg" alt="Пальто">
                        <div class="product-info">
                            <h3>Пальто из кожи</h3>
                            <p class="price">≈ 11 699 ₽</p>
                        </div>
                    </div>
                    <div class="product-card">
                        <img src="img/платье2.svg" alt="Платье с бантом">
                        <div class="product-info">
                            <h3>Платье с бантом</h3>
                            <p class="price">≈ 4 199 ₽</p>
                        </div>
                    </div>
                </div>
                <a href="#" class="view-more" style="margin-top: 16px;">Все избранные →</a>
            </div>
        </div>
    </div>
</main>

<!-- ПОДВАЛ -->
<footer class="footer">
    <!-- Скопируйте весь footer из index.html -->
</footer>

<script>
    // Скопируйте JS из index.html
</script>
</body>
</html>
